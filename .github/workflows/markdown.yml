# Lint Markdown files with markdownlint-cli2 on PRs and pushes to main.
name: Markdown

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Run markdownlint-cli2
        # Pins action v24.2.0 → markdownlint-cli2 v0.23.2 / markdownlint v0.41.1
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
